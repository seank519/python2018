<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBT 연습 테스트</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0d1117;
      --panel: #161b22;
      --accent: #2e8bff;
      --border: #30363d;
      --text: #e6edf3;
      --subtle: #7d8590;
      --correct: #33c863;
      --wrong: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      justify-content: center;
    }

    main {
      width: min(920px, 100%);
      padding: 48px 24px 64px;
    }

    header {
      background: linear-gradient(145deg, #1f2937, #0f172a);
      padding: 28px 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--subtle);
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .question {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 18px 12px;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 14px;
      color: var(--subtle);
      margin-bottom: 6px;
    }

    .question h2 {
      margin: 6px 0 14px;
      font-size: 18px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    label.choice {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    label.choice:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(46, 139, 255, 0.15);
      transform: translateY(-1px);
    }

    .short-answer {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button.primary {
      background: var(--accent);
      color: #0b1221;
      box-shadow: 0 10px 20px rgba(46, 139, 255, 0.35);
    }

    button.secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .result {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(46, 139, 255, 0.08);
      border: 1px solid rgba(46, 139, 255, 0.25);
      color: #cde3ff;
      display: none;
    }

    .feedback {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      color: var(--subtle);
      display: none;
      background: rgba(255, 255, 255, 0.02);
    }

    .feedback.correct {
      border-color: rgba(51, 200, 99, 0.5);
      color: var(--correct);
    }

    .feedback.incorrect {
      border-color: rgba(255, 107, 107, 0.5);
      color: var(--wrong);
    }

    @media (max-width: 640px) {
      main { padding-inline: 16px; }
      header { padding: 22px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>CBT 모의 시험</h1>
      <p>
        예시 문항을 담은 간단한 CBT 웹앱입니다. 문제에 답한 뒤 맨 아래 "제출"을 누르면
        자동으로 채점하고, 전체 점수와 문항별 정답을 확인할 수 있습니다.
      </p>
    </header>

    <form id="quiz-form">
      <div id="questions"></div>
      <div class="actions">
        <button type="submit" class="primary">제출</button>
        <button type="button" class="secondary" id="reset-btn">초기화</button>
      </div>
      <div class="result" id="result"></div>
    </form>
  </main>

  <script>
    const questions = [
      {
        id: "prob-1",
        type: "mc",
        title: "HTTP 상태 코드 200은 무엇을 의미하나요?",
        choices: [
          "클라이언트 오류",
          "리소스를 찾을 수 없음",
          "성공적으로 요청을 처리함",
          "인증 필요"
        ],
        answerIndex: 2,
        points: 2,
      },
      {
        id: "prob-2",
        type: "mc",
        title: "다음 중 CSS에서 flexbox를 가로 방향으로 배치하도록 지정하는 속성은?",
        choices: [
          "flex-direction: row;",
          "align-items: center;",
          "display: grid;",
          "position: relative;"
        ],
        answerIndex: 0,
        points: 2,
      },
      {
        id: "prob-3",
        type: "short",
        title: "JavaScript에서 이벤트를 등록할 때 사용하는 메서드 이름을 적으세요.",
        answerText: "addEventListener",
        alternatives: ["add event listener", "addeventlistener"],
        placeholder: "예: addEventListener",
        points: 3,
      },
      {
        id: "prob-4",
        type: "mc",
        title: "SQL에서 특정 테이블의 전체 행 수를 구하는 쿼리는 무엇인가요?",
        choices: [
          "SELECT COUNT(*) FROM table;",
          "SELECT SUM(*) FROM table;",
          "COUNT ROWS table;",
          "SELECT LEN(*) FROM table;"
        ],
        answerIndex: 0,
        points: 3,
      },
    ];

    const questionsContainer = document.getElementById("questions");
    const form = document.getElementById("quiz-form");
    const resultEl = document.getElementById("result");
    const resetBtn = document.getElementById("reset-btn");

    function renderQuestions() {
      const fragment = document.createDocumentFragment();

      questions.forEach((q, index) => {
        const wrapper = document.createElement("section");
        wrapper.className = "question";
        wrapper.dataset.questionId = q.id;

        const header = document.createElement("div");
        header.className = "question-header";
        header.innerHTML = `<span>문제 ${index + 1}</span><span>${q.points}점</span>`;

        const title = document.createElement("h2");
        title.textContent = q.title;

        wrapper.append(header, title);

        if (q.type === "mc") {
          const choices = document.createElement("div");
          choices.className = "choices";

          q.choices.forEach((choice, cIndex) => {
            const label = document.createElement("label");
            label.className = "choice";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = q.id;
            input.value = cIndex;
            input.required = true;

            const text = document.createElement("span");
            text.textContent = choice;

            label.append(input, text);
            choices.appendChild(label);
          });

          wrapper.appendChild(choices);
        }

        if (q.type === "short") {
          const input = document.createElement("input");
          input.type = "text";
          input.name = q.id;
          input.className = "short-answer";
          input.placeholder = q.placeholder ?? "정답을 입력하세요";
          input.required = true;
          wrapper.appendChild(input);
        }

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.id = `${q.id}-feedback`;
        wrapper.appendChild(feedback);

        fragment.appendChild(wrapper);
      });

      questionsContainer.replaceChildren(fragment);
    }

    function checkAnswer(question, userValue) {
      if (question.type === "mc") {
        const isCorrect = Number(userValue) === question.answerIndex;
        const correctText = question.choices[question.answerIndex];
        return { isCorrect, correctText, userValue: question.choices[userValue] };
      }

      if (question.type === "short") {
        const normalized = String(userValue).trim().toLowerCase();
        const answers = [question.answerText, ...(question.alternatives ?? [])].map((a) =>
          String(a).trim().toLowerCase()
        );
        const isCorrect = answers.includes(normalized);
        return { isCorrect, correctText: question.answerText, userValue };
      }

      return { isCorrect: false, correctText: "", userValue };
    }

    function showFeedback(question, result) {
      const feedback = document.getElementById(`${question.id}-feedback`);
      feedback.style.display = "block";
      feedback.classList.toggle("correct", result.isCorrect);
      feedback.classList.toggle("incorrect", !result.isCorrect);

      const prefix = result.isCorrect ? "정답입니다!" : "오답입니다.";
      feedback.textContent = `${prefix} 정답: ${result.correctText}`;
    }

    function handleSubmit(event) {
      event.preventDefault();
      let score = 0;
      const total = questions.reduce((acc, q) => acc + q.points, 0);

      questions.forEach((q) => {
        const formValue = form.elements[q.id]?.value;
        const result = checkAnswer(q, formValue);
        if (result.isCorrect) score += q.points;
        showFeedback(q, result);
      });

      resultEl.style.display = "block";
      resultEl.textContent = `총점: ${score} / ${total}점 (${Math.round((score / total) * 100)}%)`;
    }

    function resetForm() {
      form.reset();
      resultEl.style.display = "none";
      document.querySelectorAll(".feedback").forEach((el) => {
        el.style.display = "none";
        el.classList.remove("correct", "incorrect");
        el.textContent = "";
      });
    }

    form.addEventListener("submit", handleSubmit);
    resetBtn.addEventListener("click", resetForm);

    renderQuestions();
  </script>
</body>
</html>
